name: Deploy API (Render)

# Node.js API (apps/api) -> Render web service defined in render.yaml.
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/types/**
      - pnpm-lock.yaml
      - render.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.18.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npx nx run-many -t typecheck test --projects=shop-api,@shop/types

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Wait until the new version is healthy
        run: |
          # Free plan cold starts + build can take a few minutes.
          for i in $(seq 1 40); do
            if curl --fail --silent --max-time 10 "$HEALTH_URL"; then echo; echo "healthy"; exit 0; fi
            echo "waiting ($i/40)…"; sleep 15
          done
          echo "API did not become healthy" >&2; exit 1
        env:
          HEALTH_URL: ${{ vars.API_HEALTH_URL }}
