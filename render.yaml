# Render Blueprint for the Fastify API. Frontends are deployed by Zephyr, not Render.
services:
  - type: web
    name: shop-api
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@12.18.0 install --frozen-lockfile --filter shop-api...
    startCommand: cd apps/api && ./node_modules/.bin/tsx src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.15.1
      - key: DB_FILE
        value: /tmp/shop.sqlite # free plan has an ephemeral disk; see README
